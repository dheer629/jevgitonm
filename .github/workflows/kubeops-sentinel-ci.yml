name: KubeOps Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubeops-sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TERM: dumb
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl netcat-openbsd shellcheck

      - name: Executable and syntax gates
        shell: bash
        run: |
          set -euo pipefail
          test -x KubeOps_Sentinel.sh
          mapfile -t scripts < <(git ls-files '*.sh')
          ((${#scripts[@]} > 0))
          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
            if LC_ALL=C grep -q $'\r' "$script"; then
              echo "CRLF detected: $script" >&2
              exit 1
            fi
          done

      - name: ShellCheck errors
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck --severity=error "${scripts[@]}"

      - name: Repository safety policy
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'sentinel-output/**' '.sentinel-dev/validation.*.log' '.sentinel-dev/image/**' '.sentinel-dev/*.lock' '.sentinel-dev/*.tmp')
          if [[ -n "$tracked" ]]; then
            echo 'Generated runtime/test artifacts are tracked unexpectedly:'
            printf '%s\n' "$tracked"
            exit 1
          fi
          matches=$(git grep -nE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}' -- ':!sentinel-output/**' 2>/dev/null | grep -vi 'fixture' || true)
          if [[ -n "$matches" ]]; then
            echo 'Potential credential/private-key material found in tracked content:'
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Output contract regression tests
        run: bash .sentinel-dev/e2e/output-contract-test.sh

      - name: Full developer validation gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B ci-validation "$GITHUB_SHA"
          ./KubeOps_Sentinel.sh --dev-validate --non-interactive --output ./sentinel-output

      - name: TLS and GitOps loopback E2E
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 120s bash .sentinel-dev/e2e/tls-live-test.sh
          test "$(tail -n 1 sentinel-output/validation/tls-gitops-e2e.md)" = 'Aggregate failures: 0'

      - name: Repository whitespace check
        shell: bash
        run: git diff --check
